<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 1 - Introdução às Finanças</title>
    <!-- LINK PARA O SEU NOVO ARQUIVO MODULARIZADO DE NÍVEIS -->
    <link rel="stylesheet" href="../../CSS/niveis.css">
</head>
<body>

    <div class="exercise-container">
        <h1>Fase 1: O que é uma <strong>Reserva de Emergência</strong>?🤔</h1>
        <p>Pense em situações inesperadas, não em desejos ou planos.
        <div class="options">
            <button class="option-btn" onclick="verificarResposta(false)">A) Dinheiro investido em ações para ganhar mais rápido.</button>
            <button class="option-btn" onclick="verificarResposta(true)">B) Valor guardado para imprevistos, como perder o emprego ou ter uma despesa médica inesperada</button>
            <button class="option-btn" onclick="verificarResposta(false)">C) Uma roupa de marca comprada no cartão de crédito.</button>
        </div>

        <div id="feedback"></div>

            <!-- NA FASE 1, BOTAO DE Voltar ao Menu, SE DESISTIR -->
        <a href="../../index.html" class="back-link">← Voltar ao Menu</a>
    </div>

    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                feedback.innerHTML = "🎉 Correto!  Um investimento seguro e com liquidez diária.<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Avançar na Trilha</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Tente novamente! A reserva de emergência serve para cobrir imprevistos.";
                feedback.className = "incorrect";
            }
        }

        function concluirFase() {
            // Salva no navegador que a Fase 1 foi concluída
            localStorage.setItem('fase_1_concluida', 'true');
            
            // (BOTAO (AVANÇAR NA TRILHA), APOS ACERTA A QUESTAO)
            window.location.href = "../../index.html";
        }
    </script>

</body>
</html>
