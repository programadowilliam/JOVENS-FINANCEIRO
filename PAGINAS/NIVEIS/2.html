<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 2 - Necessidade vs Desejo 🛒</title>
    <!-- LINK PARA O SEU ARQUIVO MODULARIZADO DE NÍVEIS -->
    <link rel="stylesheet" href="../../CSS/niveis.css">
</head>
<body>
    <div class="exercise-container">
        <h1>Fase 2: Necessidade vs Desejo 🛒</h1>
        <p>Você recebeu seu primeiro salário. Qual é a atitude financeira mais saudável?
        <div class="options">
            <button class="option-btn" onclick="verificarResposta(false)">A) Parcelar o máximo de compras possível para não sentir o impacto no bolso.</button>
            <button class="option-btn" onclick="verificarResposta(false)">B) Gastar tudo no primeiro mês para aproveitar, já que o próximo salário vem logo.</button>
            <button class="option-btn" onclick="verificarResposta(true)">C) Planejar o orçamento, separando uma parte para gastos essenciais, lazer e poupança</button>
        </div>
        <div id="feedback"></div>

          <!-- NA FASE 2, BOTAO DE Voltar ao Menu, SE DESISTIR -->
        <a href="../../trilha.html" class="back-link">← Voltar ao menu</a>
    </div>

    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.innerHTML = "🎉 Mandou bem! Ótimo planejamento!<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Avançar na Trilha</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Tente novamente! Organizar o orçamento desde o início cria o hábito de controlar seus gastos.";
                feedback.className = "incorrect";
            }
        }
        function concluirFase() {
            localStorage.setItem('fase_2_concluida', 'true');

            // (BOTAO (AVANÇAR NA TRILHA), APOS ACERTA A QUESTAO)
            window.location.href = "../../trilha.html";
        }
    </script>
</body>
</html>
