<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 6 - Proteção Patrimonial</title>
    <!-- LINK PARA O ARQUIVO MODULARIZADO DE ESTILOS -->
    <link rel="stylesheet" href="../../niveis.css">
</head>
<body>
    <div class="exercise-container">
        <h1>Fase 6: Proteção do seu Ouro 🛡️</h1>
        <p>Você completou sua trilha financeira! Para proteger tudo o que conquistou até aqui de golpes e fraudes digitais, qual é a principal recomendação de segurança?</p>
        <div class="options">
            <button class="option-btn" onclick="verificarResposta(false)">A) Usar a mesma senha fácil em todas as contas e anotá-la num bloco de notas aberto.</button>
            <button class="option-btn" onclick="verificarResposta(true)">B) Ativar a Autenticação de Dois Fatores (2FA) em apps de bancos e e-mails importantes.</button>
            <button class="option-btn" onclick="verificarResposta(false)">C) Compartilhar prints dos seus investimentos nas redes sociais para ganhar seguidores.</button>
        </div>
        <div id="feedback"></div>
        <a href="../../index.html" class="back-link">← Desistir e voltar</a>
    </div>
    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.innerHTML = "🏆 Incrível! Você completou a última fase com sucesso total e protegeu seu patrimônio.<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Finalizar Trilha 🎉</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Cuidado! Senhas repetidas ou superexposição facilitam a ação de criminosos.";
                feedback.className = "incorrect";
            }
        }
        function concluirFase() {
            localStorage.setItem('fase_6_concluida', 'true');
            alert("Parabéns! Você concluiu com maestria o treinamento básico da GranaUp! ⚡");
            window.location.href = "../../index.html";
        }
    </script>
</body>
</html>
