<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 4 - Poupança e Reserva</title>
    <!-- LINK PARA O ARQUIVO MODULARIZADO (Volta de NIVEIS e PAGINAS para achar o css na raiz) -->
    <link rel="stylesheet" href="../../niveis.css">
</head>
<body>
    <div class="exercise-container">
        <h1>Fase 4: Reserva de Emergência 🐷</h1>
        <p>Qual é o principal objetivo de construir e manter uma <strong>Reserva de Emergência</strong>?</p>
        <div class="options">
            <button class="option-btn" onclick="verificarResposta(true)">A) Cobrir gastos inesperados (como saúde ou desemprego) sem precisar recorrer a empréstimos.</button>
            <button class="option-btn" onclick="verificarResposta(false)">B) Juntar dinheiro para gastar em uma viagem internacional nas férias.</button>
            <button class="option-btn" onclick="verificarResposta(false)">C) Comprar ações de alto risco na Bolsa de Valores visando lucros rápidos.</button>
        </div>
        <div id="feedback"></div>
        <a href="../../index.html" class="back-link">← Desistir e voltar</a>
    </div>
    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.innerHTML = "🎉 Certo! A reserva serve para te dar paz de espírito e segurança em momentos difíceis.<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Avançar na Trilha</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Incorreto! Viagens e ações de risco usam contas e caixas separados.";
                feedback.className = "incorrect";
            }
        }
        function concluirFase() {
            localStorage.setItem('fase_4_concluida', 'true');
            window.location.href = "../../index.html";
        }
    </script>
</body>
</html>
