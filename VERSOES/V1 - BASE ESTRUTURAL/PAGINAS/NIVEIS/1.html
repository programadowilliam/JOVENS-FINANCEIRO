<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 1 - Introdução às Finanças</title>
    <!-- LINK PARA O SEU NOVO ARQUIVO MODULARIZADO DE NÍVEIS -->
    <link rel="stylesheet" href="../../niveis.css">
</head>
<body>

    <div class="exercise-container">
        <h1>Fase 1: O que é Ativo? 🎯</h1>
        <p>Imagine que você quer fazer seu dinheiro render. Qual das alternativas abaixo representa melhor um <strong>Ativo Financeiro</strong>?</p>

        <div class="options">
            <button class="option-btn" onclick="verificarResposta(false)">A) Um carro zero comprado para uso próprio.</button>
            <button class="option-btn" onclick="verificarResposta(true)">B) Uma aplicação que coloca dinheiro no seu bolso periodicamente.</button>
            <button class="option-btn" onclick="verificarResposta(false)">C) Uma roupa de marca comprada no cartão de crédito.</button>
        </div>

        <div id="feedback"></div>

        <!-- Caminho para voltar para a raiz do site -->
        <a href="../../index.html" class="back-link">← Voltar ao Menu</a>
    </div>

    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                feedback.innerHTML = "🎉 Correto! Ativos colocam dinheiro no seu bolso.<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Avançar na Trilha</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Tente novamente! Isso é considerado um passivo (gera gastos).";
                feedback.className = "incorrect";
            }
        }

        function concluirFase() {
            // Salva no navegador que a Fase 1 foi concluída
            localStorage.setItem('fase_1_concluida', 'true');
            
            // Retorna automaticamente para o mapa principal
            window.location.href = "../../index.html";
        }
    </script>

</body>
</html>
