<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GranaUp | Trilha Evolutiva</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2 family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header fixo -->
    <header class="navbar">
        <div class="logo">⚡ Grana<span>Up</span></div>
        <div class="user-status">
            <div class="streak">🔥 <span id="streakCount">0</span> Dias</div>
            <div class="coins">🪙 <span id="xpCount">0</span> XP</div>
        </div>
    </header>

    <!-- Área do Mapa -->
    <main class="map-viewport" id="mapViewport">
        <div class="map-scrollable-content" id="mapContent">
            
            <div class="chapter-banner">
                <div class="chapter-info">
                    <span>SEÇÃO 1, CAPÍTULO 1</span>
                    <h1>Introdução à Sobrevivência Financeira</h1>
                </div>
            </div>

            <!-- Linha guia da trilha -->
            <svg class="map-path-svg" xmlns="http://w3.org" viewBox="0 0 480 1400">
                <path id="trilha-line" d="M 240,160 Q 340,260 240,360 T 240,560 T 240,760 T 240,960 T 240,1160" />
            </svg>

            <!-- Camada de Nós / Gerada Dinamicamente pelo JS -->
            <div class="nodes-layer" id="nodesLayer"></div>

        </div>
    </main>

    <!-- Pop-up Modal Simulando o Exercício da Fase -->
    <div class="quiz-modal" id="quizModal">
        <div class="modal-content">
            <h2>⚡ Desafio Relâmpago!</h2>
            <p id="quizText">Carregando pergunta...</p>
            <div class="modal-buttons">
                <button class="btn-action correct" onclick="completeCurrentStage()">Fazer a Jogada Certa (+20 XP)</button>
                <button class="btn-action cancel" onclick="closeQuiz()">Desistir por enquanto</button>
            </div>
        </div>
    </div>

    <!-- Navegação Inferior -->
    <nav class="mobile-nav">
        <a href="#trilha" class="nav-item active">🗺️ <span>Trilha</span></a>
        <a href="#ranking" class="nav-item">🏆 <span>Ranking</span></a>
        <a href="#perfil" class="nav-item">👤 <span>Perfil</span></a>
    </nav>

    <script src="index.js"></script>
</body>
</html>
