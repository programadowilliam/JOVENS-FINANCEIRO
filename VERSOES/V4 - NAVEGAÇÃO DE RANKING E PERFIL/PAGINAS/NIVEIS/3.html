<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 3 - Crédito e Juros</title>
    <!-- LINK PARA O ARQUIVO MODULARIZADO DE ESTILOS -->
    <link rel="stylesheet" href="../../niveis.css">
</head>
<body>
    <div class="exercise-container">
        <h1>Fase 3: O Perigo dos Juros 💰</h1>
        <p>A fatura do seu cartão de crédito fechou em R$ 500. Você não tem o dinheiro total, mas o banco oferece a opção de pagar o "mínimo" de R$ 50. O que acontece se você pagar apenas o mínimo?</p>
        <div class="options">
            <button class="option-btn" onclick="verificarResposta(false)">A) O restante da dívida some e seu limite é liberado no mês seguinte.</button>
            <button class="option-btn" onclick="verificarResposta(false)">B) O banco congela a dívida sem cobrar taxas por você ter pago uma parte.</button>
            <button class="option-btn" onclick="verificarResposta(true)">C) Os R$ 450 restantes vão para o "Crédito Rotativo", acumulando juros altíssimos sobre o saldo.</button>
        </div>
        <div id="feedback"></div>
        <a href="../../index.html" class="back-link">← Desistir e voltar</a>
    </div>
    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.innerHTML = "🎉 Resposta Exata! O rotativo do cartão tem os juros mais caros do mercado.<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Avançar na Trilha</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Errado! Nunca caia nessa armadilha; o restante vira uma bola de neve financeira.";
                feedback.className = "incorrect";
            }
        }
        function concluirFase() {
            localStorage.setItem('fase_3_concluida', 'true');
            window.location.href = "../../index.html";
        }
    </script>
</body>
</html>
