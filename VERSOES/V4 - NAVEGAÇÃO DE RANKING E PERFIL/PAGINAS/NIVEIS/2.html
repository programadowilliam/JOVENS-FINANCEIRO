<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fase 2 - Consumo Consciente</title>
    <!-- LINK PARA O SEU ARQUIVO MODULARIZADO DE NÍVEIS -->
    <link rel="stylesheet" href="../../niveis.css">
</head>
<body>
    <div class="exercise-container">
        <h1>Fase 2: Necessidade vs Desejo 🛒</h1>
        <p>Você quer comprar um tênis novo de uma marca famosa, mas o seu atual ainda está em ótimo estado. Qual atitude reflete melhor o <strong>Consumo Consciente</strong>?</p>
        <div class="options">
            <button class="option-btn" onclick="verificarResposta(false)">A) Comprar imediatamente parcelado em 12x para aproveitar o frete grátis.</button>
            <button class="option-btn" onclick="verificarResposta(true)">B) Aguardar, planejar o gasto e avaliar se a compra não vai afetar suas metas financeiras.</button>
            <button class="option-btn" onclick="verificarResposta(false)">C) Pegar dinheiro emprestado com um amigo para pagar à vista com desconto.</button>
        </div>
        <div id="feedback"></div>
        <a href="../../index.html" class="back-link">← Desistir e voltar</a>
    </div>
    <script>
        function verificarResposta(isCorrect) {
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.innerHTML = "🎉 Mandou bem! Consumo consciente envolve adiar impulsos e planejar.<br><br>" +
                                     "<button class='next-btn' onclick='concluirFase()'>Avançar na Trilha</button>";
                feedback.className = "correct";
            } else {
                feedback.textContent = "❌ Tente novamente! Comprar por impulso compromete seu orçamento futuro.";
                feedback.className = "incorrect";
            }
        }
        function concluirFase() {
            localStorage.setItem('fase_2_concluida', 'true');
            window.location.href = "../../index.html";
        }
    </script>
</body>
</html>
