<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JOVENS FINANCEIROS</title>
    
    <!-- Chamadas dos estilos modulares corrigidas -->
    <link rel="stylesheet" href="dias_xpstyle.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <link rel="stylesheet" href="mapa.style.css"> <!-- CORREÇÃO: Removido o 's' duplicado de stylessheet -->
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- CORREÇÃO: Link oficial parametrizado para importar a fonte Nunito corretamente -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Header fixo -->
    <header class="navbar">
        <div class="logo">⚡ JOVENS<span> FINANCEIROS</span></div>
        <div class="user-status">
            <div class="streak">🔥 <span id="streakCount">3</span> Dias</div>
            <div class="coins">🟡 <span id="xpCount">20</span> XP</div>
        </div>
    </header>

    <!-- Área do Mapa -->
    <main class="map-viewport" id="mapViewport">
        <div class="map-scrollable-content" id="mapContent">
            
            <div class="chapter-banner">
                <div class="chapter-info">
                    <span>SEÇÃO 1, CAPÍTULO 1</span>
                    <h1>Introdução à Sobrevivência Financeira</h1>
                </div>
            </div>

            <!-- CORREÇÃO: Namespace XML oficial reestabelecido para desenhar a linha curva na tela -->
            <svg class="map-path-svg" xmlns="http://w3.org" viewBox="0 0 480 1400">
                <path id="trilha-line" d="M 240,160 Q 340,260 240,360 T 240,560 T 240,760 T 240,960 T 240,1160" />
            </svg>

            <!-- Camada de Nós / Gerada Dinamicamente pelo JS -->
            <div class="nodes-layer" id="nodesLayer"></div>

        </div>
    </main>

    <!-- Pop-up Modal Simulando o Exercício da Fase -->
    <div class="quiz-modal" id="quizModal">
        <div class="modal-content">
            <h2>⚡ Desafio Relâmpago!</h2>
            <p id="quizText">Carregando pergunta...</p>
            <div class="modal-buttons">
                <button class="btn-action correct" onclick="window.location.href='PAGINAS/NIVEIS/1.html'">Iniciar Fase 1 (+20 XP)</button>
                <button class="btn-action cancel" onclick="closeQuiz()">Desistir por enquanto</button>
            </div>
        </div>
    </div>

    <!-- Navegação Inferior -->
    <nav class="mobile-nav">
        <a href="index.html" class="nav-item active">🗺️ <span>Trilha</span></a>
        <a href="PAGINAS/MENUS/ranking.html" class="nav-item">🏆 <span>Ranking</span></a>
        <a href="PAGINAS/MENUS/perfil.html" class="nav-item">👤 <span>Perfil</span></a>
    </nav>


    <script src="index.js"></script>
</body>
</html>
